$kind: http-request
url: "{{baseUrl}}/api/service-requests/{{serviceRequestId}}/status"
method: PATCH
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "status": "Completed"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('Completed', () => pm.expect(pm.response.json().status).to.eql('Completed'));
    language: text/javascript
order: 6000
