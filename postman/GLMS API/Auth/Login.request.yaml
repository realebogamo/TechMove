$kind: http-request
url: "{{baseUrl}}/api/auth/login"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
auth:
  type: noauth
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      const body = pm.response.json();
      pm.test('returns an access token', () => pm.expect(body.accessToken).to.be.a('string').and.not.empty);
      pm.collectionVariables.set('token', body.accessToken);
    language: text/javascript
order: 1000
