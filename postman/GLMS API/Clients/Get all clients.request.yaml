$kind: http-request
url: "{{baseUrl}}/api/clients"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('returns an array', () => pm.expect(pm.response.json()).to.be.an('array'));
    language: text/javascript
order: 3000
