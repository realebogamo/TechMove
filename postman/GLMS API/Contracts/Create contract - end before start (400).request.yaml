$kind: http-request
url: "{{baseUrl}}/api/contracts"
method: POST
headers:
  - key: Content-Type
    value: application/json
body:
  type: json
  content: |-
    {
      "title": "Bad dates",
      "clientId": {{clientId}},
      "startDate": "2026-12-31",
      "endDate": "2026-01-01",
      "serviceLevel": "Standard"
    }
scripts:
  - type: afterResponse
    code: pm.test('400 Bad Request', () => pm.response.to.have.status(400));
    language: text/javascript
order: 2000
