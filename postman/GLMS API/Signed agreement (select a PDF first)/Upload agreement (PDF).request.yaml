$kind: http-request
url: "{{baseUrl}}/api/contracts/{{contractId}}/agreement"
method: POST
body:
  type: formdata
  content:
    - type: file
      key: file
      src: []
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('agreement stored', () => pm.expect(pm.response.json().hasSignedAgreement).to.be.true);
    language: text/javascript
order: 1000
