$kind: http-request
url: "{{baseUrl}}/api/exchange-rates/usd-zar"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test('200 OK', () => pm.response.to.have.status(200));
      pm.test('rate is positive', () => pm.expect(pm.response.json().rate).to.be.above(0));
    language: text/javascript
order: 1000
