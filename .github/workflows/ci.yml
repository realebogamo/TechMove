name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore
        run: dotnet restore GLMS.sln

      - name: Build
        run: dotnet build GLMS.sln --configuration Release --no-restore

      - name: Test
        run: >
          dotnet test GLMS.sln --configuration Release --no-build
          --logger "trx;LogFilePrefix=results"
          --logger "console;verbosity=normal"
          --collect:"XPlat Code Coverage"
          --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
